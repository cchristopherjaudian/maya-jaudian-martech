services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: martech_db
      POSTGRES_USER: martech_user
      POSTGRES_PASSWORD: martech_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martech_user -d martech_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://martech_user:martech_pass@db:5432/martech_db
      PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
